name: GitLeaks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Gitleaks with Custom Config
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LOG_LEVEL: debug
          GITLEAKS_REPO_PATH: .
          GITLEAKS_IGNORE_PATHS: .github,.git,venv
          GITLEAKS_IGNORE_FILES: Dockerfile
          GITLEAKS_IGNORE_GIT_ATTRIBUTES: true
          GITLEAKS_IGNORE_GIT_IGNORE: true
          GITLEAKS_IGNORE_GIT_ATTRIBUTES_PATH: .gitignore
          GITLEAKS_IGNORE_GIT_IGNORE_PATH: .gitignore