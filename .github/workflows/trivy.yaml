name: Trivy SCA Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-db
          restore-keys: trivy-${{ runner.os }}-db

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        id: scan
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-report.txt'
          skip-dirs: '.github,.git,venv,k8s'
          skip-files: 'Dockerfile'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'  
          exit-code: 1

      - name: Read Trivy Report
        id: read-report
        run: |
          if [ -f trivy-report.txt ]; then
            REPORT=$(cat trivy-report.txt)
            echo "report<<EOF" >> $GITHUB_ENV
            echo "$REPORT" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = process.env.report;
            const message = report && report.trim().length > 0
              ? `## 🚨 Trivy Security Scan Results\n\`\`\`\n${report}\n\`\`\`\n\nPlease review these vulnerabilities before merging.`
              : '## ✅ Trivy Security Scan Results\nNo vulnerabilities found!';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Create Job Summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "## Trivy Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-report.txt ]; then
            echo "🚨 Vulnerabilities Found:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for vulnerabilities
        if: steps.read-report.outputs.has_vulnerabilities == 'true'
        run: exit 1
        