name: Checkov
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Checkov scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          skip_path: ".github,.git,venv"
          quiet: true