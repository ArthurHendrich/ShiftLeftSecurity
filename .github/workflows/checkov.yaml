name: Checkov Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checkov-scan:
    name: Checkov Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov scan
        id: scan
        continue-on-error: true
        run: |
          checkov -d . \
            --quiet \
            --compact \
            --skip-path .github \
            --skip-path .git \
            --skip-path venv \
            > checkov-report.txt

      - name: Read Checkov Report
        id: read-report
        run: |
          if [ -f checkov-report.txt ]; then
            REPORT=$(cat checkov-report.txt)
            echo "report<<EOF" >> $GITHUB_ENV
            echo "$REPORT" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            if grep -q "Failed checks: [^0]" checkov-report.txt; then
              echo "has_failures=true" >> $GITHUB_OUTPUT
            else
              echo "has_failures=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = process.env.report;
            let message;
            if (report && report.trim().length > 0) {
              const failedCount = (report.match(/Failed checks: (\d+)/)?.[1] || '0');
              const passedCount = (report.match(/Passed checks: (\d+)/)?.[1] || '0');
              message = `## 🔍 Checkov Security Scan Results\n\n### Summary\n- ✅ Passed Checks: ${passedCount}\n- ❌ Failed Checks: ${failedCount}\n\n<details>\n<summary>Click to see detailed results</summary>\n\n\`\`\`\n${report}\n\`\`\`\n</details>\n\n${failedCount !== '0' ? '⚠️ Please review and fix the security issues before merging.' : '✨ All security checks passed!'}`;
            } else {
              message = '## ✅ Checkov Security Scan Results\nNo issues found!';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Create Job Summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "## Checkov Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f checkov-report.txt ]; then
            if grep -q "Failed checks: [^0]" checkov-report.txt; then
              echo "⚠️ Security Issues Found:" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No security issues found!" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat checkov-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No security issues found!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for failures
        if: steps.read-report.outputs.has_failures == 'true'
        run: exit 1