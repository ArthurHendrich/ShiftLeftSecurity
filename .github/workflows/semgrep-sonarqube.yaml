name: Semgrep + SonarQube

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Semgrep scan
        run: |
          semgrep scan --config auto --json --output semgrep-results.json

      - name: Convert Semgrep JSON to SonarQube format
        run: |
          apt-get update && apt-get install -y python3 python3-pip
          pip3 install requests
          python3 convert_semgrep_to_sonarqube.py semgrep-results.json > semgrep-sonarqube.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep-sonarqube.json

  sonarqube-scan:
    needs: semgrep-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download scan results
        uses: actions/download-artifact@v3
        with:
          name: semgrep-results
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Sonar Scanner
        uses: warchant/setup-sonar-scanner@v8

      - name: SonarQube Analysis
        id: sonar
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          source $GITHUB_ENV
          sonar-scanner \
            -Dsonar.projectKey=ShiftLeftSecurity \
            -Dsonar.sources=. \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.externalIssuesReportPaths=semgrep-sonarqube.json \
            -Dsonar.verbose=true

      - name: Get SonarQube Results
        id: sonarqube_status
        if: github.event_name == 'pull_request'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sleep 10
          
          # Get project status
          STATUS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=ShiftLeftSecurity")
          STATUS=$(echo $STATUS_RESPONSE | jq -r '.projectStatus.status')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          
          # Get issue counts by type
          ISSUES_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=ShiftLeftSecurity&types=VULNERABILITY,BUG,CODE_SMELL&ps=1&facets=types")
          echo "issues<<EOF" >> $GITHUB_ENV
          echo "$ISSUES_RESPONSE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.sonarqube_status.outputs.status }}';
            const issues = JSON.parse(process.env.issues);
            
            let message = '## 🔍 SonarQube Analysis Results\n\n';
            message += '### Quality Gate Status\n';
            message += status === 'OK' 
              ? '✅ **Passed**\n\n'
              : '❌ **Failed**\n\n';
            
            const facets = issues.facets.find(f => f.property === 'types');
            if (facets) {
              message += '### Issues Summary\n\n';
              const types = {
                VULNERABILITY: '🛡️ Security Issues',
                BUG: '🐛 Bugs',
                CODE_SMELL: '🔧 Code Smells'
              };
              
              facets.values.forEach(value => {
                if (types[value.val]) {
                  message += `- ${types[value.val]}: **${value.count}**\n`;
                }
              });
            }
            
            message += `\n🔗 [View detailed report](${process.env.SONAR_HOST_URL}/dashboard?id=ShiftLeftSecurity)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Sonarqube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}