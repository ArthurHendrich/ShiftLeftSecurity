name: Semgrep + SonarQube

on:
  push:
    branches: ["main"]

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Semgrep scan
        run: |
          semgrep scan --config auto --json --output semgrep-results.json

      - name: Convert Semgrep JSON to SonarQube format
        run: |
          apt-get update && apt-get install -y python3 python3-pip
          pip3 install requests
          python3 convert_semgrep_to_sonarqube.py semgrep-results.json > semgrep-sonarqube.json

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-results
          path: |
            semgrep-sonarqube.json

  sonarqube-analysis:
    needs: semgrep-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download scan results
        uses: actions/download-artifact@v3
        with:
          name: semgrep-results
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Sonar Scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip -d $HOME
          mv $HOME/sonar-scanner-5.0.1.3006-linux $HOME/sonar-scanner
          echo "SONAR_SCANNER_HOME=$HOME/sonar-scanner" >> $GITHUB_ENV
          echo "PATH=$HOME/sonar-scanner/bin:$PATH" >> $GITHUB_ENV
          echo "SONAR_SCANNER_OPTS=-server" >> $GITHUB_ENV

      - name: SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          source $GITHUB_ENV
          sonar-scanner \
            -Dsonar.projectKey=ShiftLeftSecurity \
            -Dsonar.sources=. \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.externalIssuesReportPaths=semgrep-sonarqube.json \
            -Dsonar.verbose=true
