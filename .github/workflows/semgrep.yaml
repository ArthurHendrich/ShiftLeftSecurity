name: Semgrep + SonarQube

on:
  push:
    branches: ["main"]

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Semgrep scan
        run: semgrep scan --config auto --sarif --output-file semgrep-report.sarif

      - name: Upload SARIF
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-report.sarif
          path: semgrep-report.sarif

  sonarqube-analysis:
    needs: semgrep-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download SARIF artifact
        uses: actions/download-artifact@v3
        with:
          name: semgrep-report.sarif
          path: .

      - name: Print SARIF file for debugging
        run: cat semgrep-report.sarif
  
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Install Sonar Scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip -d $HOME
          mv $HOME/sonar-scanner-5.0.1.3006-linux $HOME/sonar-scanner
          echo "SONAR_SCANNER_HOME=$HOME/sonar-scanner" >> $GITHUB_ENV
          echo "PATH=$HOME/sonar-scanner/bin:$PATH" >> $GITHUB_ENV
          echo "SONAR_SCANNER_OPTS=-server" >> $GITHUB_ENV

      - name: SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        run: |
          source $GITHUB_ENV
          sonar-scanner -X \
            -Dsonar.projectKey=my_project_key \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_LOGIN \
            -Dsonar.externalIssuesReportPaths=semgrep-report.sarif
