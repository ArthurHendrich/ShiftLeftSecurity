name: Semgrep + SonarQube

on:
  push:
    branches: ["main"]

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Semgrep scan
        run: |
          # Run semgrep and output both JSON and SARIF
          semgrep scan --config auto --json --output=semgrep-results.json
          semgrep scan --config auto --sarif --output=semgrep-report.sarif

      - name: Convert Semgrep JSON to SonarQube format
        run: |
          apt-get update && apt-get install -y python3 python3-pip
          pip3 install requests
          cat > convert.py << 'EOF'
          import json
          import sys
          from datetime import datetime

          def map_severity(semgrep_severity):
              # Map Semgrep severity levels to SonarQube severity levels
              severity_map = {
                  'ERROR': 'CRITICAL',
                  'WARNING': 'MAJOR',
                  'INFO': 'MINOR',
                  'DEBUG': 'INFO'
              }
              return severity_map.get(semgrep_severity.upper(), 'MAJOR')

          def map_type(check_id):
              # Map Semgrep rule types to SonarQube issue types
              if any(x in check_id.lower() for x in ['injection', 'xss', 'sqli', 'command']):
                  return 'VULNERABILITY'
              elif any(x in check_id.lower() for x in ['secret', 'password', 'key']):
                  return 'SECURITY_HOTSPOT'
              elif any(x in check_id.lower() for x in ['bug', 'error']):
                  return 'BUG'
              elif any(x in check_id.lower() for x in ['style', 'format']):
                  return 'CODE_SMELL'
              return 'VULNERABILITY'  # Default to vulnerability for security focus

          def convert_to_sonarqube(semgrep_json):
              issues = []
              
              for finding in semgrep_json.get('results', []):
                  # Extract metadata
                  check_id = finding.get('check_id', 'unknown')
                  extra = finding.get('extra', {})
                  
                  # Create issue location
                  text_range = {
                      'startLine': finding.get('start', {}).get('line', 1),
                      'endLine': finding.get('end', {}).get('line', 1),
                      'startColumn': finding.get('start', {}).get('col', 1),
                      'endColumn': finding.get('end', {}).get('col', 1)
                  }

                  # Create rich description with code snippet
                  description = f"{extra.get('message', '')}\n\n"
                  if 'lines' in finding:
                      description += f"```\n{finding['lines']}\n```\n"
                  if 'metadata' in extra:
                      description += f"\nReferences:\n"
                      if 'cwe' in extra['metadata']:
                          description += f"- CWE: {extra['metadata']['cwe']}\n"
                      if 'owasp' in extra['metadata']:
                          description += f"- OWASP: {extra['metadata']['owasp']}\n"
                      if 'references' in extra['metadata']:
                          for ref in extra['metadata']['references']:
                              description += f"- {ref}\n"

                  issue = {
                      'engineId': 'SEMGREP',
                      'ruleId': check_id,
                      'severity': map_severity(extra.get('severity', 'WARNING')),
                      'type': map_type(check_id),
                      'primaryLocation': {
                          'message': description,
                          'filePath': finding.get('path', ''),
                          'textRange': text_range
                      },
                      'effortMinutes': 30,  # Default remediation time
                      'tags': ['security', 'semgrep'] + extra.get('metadata', {}).get('tags', [])
                  }
                  issues.append(issue)
              
              return {
                  'issues': issues
              }
          
          # Read Semgrep results
          with open('semgrep-results.json', 'r') as f:
              semgrep_data = json.load(f)
          
          # Convert and save
          sonarqube_data = convert_to_sonarqube(semgrep_data)
          
          with open('semgrep-sonarqube.json', 'w') as f:
              json.dump(sonarqube_data, f, indent=2)
          EOF
          
          python3 convert.py

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-results
          path: |
            semgrep-report.sarif
            semgrep-sonarqube.json

  sonarqube-analysis:
    needs: semgrep-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download scan results
        uses: actions/download-artifact@v3
        with:
          name: semgrep-results
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Sonar Scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip -d $HOME
          mv $HOME/sonar-scanner-5.0.1.3006-linux $HOME/sonar-scanner
          echo "SONAR_SCANNER_HOME=$HOME/sonar-scanner" >> $GITHUB_ENV
          echo "PATH=$HOME/sonar-scanner/bin:$PATH" >> $GITHUB_ENV
          echo "SONAR_SCANNER_OPTS=-server" >> $GITHUB_ENV

      - name: SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          source $GITHUB_ENV
          sonar-scanner \
            -Dsonar.projectKey=ShiftLeftSecurity \
            -Dsonar.sources=. \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.externalIssuesReportPaths=semgrep-sonarqube.json \
            -Dsonar.verbose=true
