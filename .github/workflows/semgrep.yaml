name: Semgrep CE scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use .semgrepignore
        run: |
          if ! [ -f .semgrepignore ]; then
            wget -O .semgrepignore https://raw.githubusercontent.com/ArthurHendrich/ShiftLeftSecurity/refs/heads/main/.semgrepignore?token=GHSAT0AAAAAAC3YYXU5CWZH4IUNCR46NFN4Z34AFPQ
          fi
          echo semgrep.sarif >> .semgrepignore

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif > semgrep-report.sarif

      - name: Prepare SonarQube Analysis
        run: |
          echo "Setting up sonar-project.properties"
          echo "sonar.externalIssuesReportPaths=semgrep-report.sarif" >> sonar-project.properties
   
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Install Sonar Scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          # Download the latest Sonar Scanner CLI ZIP
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip -d $HOME
          mv $HOME/sonar-scanner-5.0.1.3006-linux $HOME/sonar-scanner
          echo "SONAR_SCANNER_HOME=$HOME/sonar-scanner" >> $GITHUB_ENV
          echo "PATH=$HOME/sonar-scanner/bin:$PATH" >> $GITHUB_ENV
          echo "SONAR_SCANNER_OPTS=-server" >> $GITHUB_ENV

      - name: SonarQube PR Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=my_project_key \
            -Dsonar.organization=my_org \
            -Dsonar.host.url=https://my-sonarqube-instance \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.externalIssuesReportPaths=semgrep-report.sarif