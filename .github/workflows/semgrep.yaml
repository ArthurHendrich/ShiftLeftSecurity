name: Semgrep CE scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}
    
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use .semgrepignore
        run: |
          if ! [ -f .semgrepignore ]; then
            wget -O .semgrepignore https://raw.githubusercontent.com/ArthurHendrich/ShiftLeftSecurity/refs/heads/main/.semgrepignore?token=GHSAT0AAAAAAC3YYXU5CWZH4IUNCR46NFN4Z34AFPQ
          fi
          echo semgrep.sarif >> .semgrepignore

      - name: Run Semgrep
        run: semgrep scan --config auto --suppress-errors --sarif > semgrep-report.sarif

      - name: Upload Semgrep findings
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep-report.sarif
        if: always()
      
